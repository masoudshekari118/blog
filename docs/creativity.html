<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تمرین خلاقیت روز</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      direction: rtl;
      background: #f1f1f1;
      text-align: center;
      padding: 50px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }

    #exercise-box {
      margin: 20px 0;
      padding: 20px;
      background: #e0ffe0;
      border-radius: 10px;
      min-height: 100px;
      font-size: 18px;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>تمرین خلاقیت روز</h1>
    <div id="exercise-box">
      <p id="exercise-text">برای دیدن تمرین، روی دکمه زیر کلیک کن</p>
    </div>
    <button onclick="showRandomExercise()">تمرین جدید</button>
  </div>

  <script>
    const exercises = [
      "با دست غیر غالبت (مثلاً دست چپ اگر راست‌دستی هستی) یه چیزی بکش.",
      "۵ کاربرد غیرمعمول برای یک گیره کاغذ بنویس.",
      "یک داستان خیلی کوتاه فقط با ۳ جمله بنویس.",
      "از پنجره نگاه کن و یه شعر برای چیزی که می‌بینی بنویس.",
      "به یه شیء توی اتاقت یه شخصیت خیالی بده و براش دیالوگ بنویس.",
      "یه لوگو برای خودت طراحی کن بدون استفاده از حروف.",
      "فهرستی از ۱۰ سوالی که هیچ‌کس تا حالا ازت نپرسیده تهیه کن.",
      "سعی کن با استفاده از ۵ شیء توی خونه، یه اختراع عجیب بسازی.",
      "داستان یه سیاره خیالی رو بنویس که رنگ آسمونش سبزه.",
      "فقط با کشیدن خط صاف و منحنی، یه تصویر مفهومی بکش."
    ];

    function showRandomExercise() {
      const randomIndex = Math.floor(Math.random() * exercises.length);
      const exercise = exercises[randomIndex];
      document.getElementById("exercise-text").textContent = exercise;
    }
  </script>
</body>
</html>
